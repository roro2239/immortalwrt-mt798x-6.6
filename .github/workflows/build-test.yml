name: 构建测试固件

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-test.yml'
      - 'defconfig/cudy-tr3000-v1-256mb.config'
      - 'feeds.conf.default'
      - 'Makefile'
      - 'include/**'
      - 'scripts/**'
      - 'target/**'
      - 'package/**'
      - 'files/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIG_FILE: defconfig/cudy-tr3000-v1-256mb.config
  TARGET_DIR: bin/targets/mediatek/filogic
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: 构建固件
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 清理 Runner 环境
        shell: bash
        run: |
          echo "清理前磁盘空间:"
          df -h
          echo "清理前内存状态:"
          free -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*

          echo "清理后磁盘空间:"
          df -h

      - name: 检出源码
        uses: actions/checkout@v4

      - name: 创建 swap
        shell: bash
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "swap 已启用:"
          sudo swapon --show
          free -h

      - name: 初始化编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib gperf haveged help2man intltool libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libzstd-dev lld llvm lrzsz mkisofs \
            msmtp ninja-build p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils python3-pyelftools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 恢复构建缓存
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
          key: ${{ runner.os }}-openwrt-tr3000-${{ hashFiles('defconfig/cudy-tr3000-v1-256mb.config', 'feeds.conf.default', 'Makefile', '.github/workflows/build-test.yml') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-tr3000-
            ${{ runner.os }}-openwrt-

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 准备单设备配置
        shell: bash
        run: |
          cp "${CONFIG_FILE}" .config
          {
            echo 'CONFIG_CCACHE=y'
            echo "CONFIG_CCACHE_DIR=\"${CCACHE_DIR}\""
          } >> .config
          ccache --max-size 2G
          make defconfig

      - name: 预下载源码
        run: make download -j"$(nproc)"

      - name: 执行编译
        shell: bash
        run: |
          make -j2 || {
            make -j1 V=s
          }

      - name: 输出 ccache 统计
        if: always()
        run: |
          ccache -s || true
          df -h
          free -h

      - name: 上传固件产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-cudy-tr3000-v1-256mb
          path: |
            ${{ env.TARGET_DIR }}/*sysupgrade*
            ${{ env.TARGET_DIR }}/*manifest
            ${{ env.TARGET_DIR }}/*profiles.json
            ${{ env.TARGET_DIR }}/sha256sums*
          if-no-files-found: error
          retention-days: 7
